CONFIG_ASPEED_ESPI_MMBI=y
CONFIG_GPIO_ASPEED_ESPI_VW=y
CONFIG_ASPEED_ESPI_SLAVE=y
CONFIG_ASPEED_LPC_SIO=y
CONFIG_ASPEED_BMC_MISC=y

# CONFIG_PECI is not set
CONFIG_PECI_LEGACY=y
CONFIG_PECI_CHARDEV_LEGACY=y
CONFIG_PECI_ASPEED=y
CONFIG_AUXILIARY_BUS=y
CONFIG_PECI_MCTP=y

CONFIG_MFD_INTEL_PECI_CLIENT=y
CONFIG_SENSORS_PECI_CPUTEMP_LEGACY=y
CONFIG_SENSORS_PECI_DIMMTEMP_LEGACY=y
CONFIG_SENSORS_PECI_CPUPOWER_LEGACY=y
CONFIG_SENSORS_PECI_DIMMPOWER_LEGACY=y
CONFIG_SENSORS_PECI_PLATFORMPOWER_LEGACY=y
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y
CONFIG_SENSORS_PECI=y
CONFIG_PMBUS=y
CONFIG_SENSORS_PMBUS=y
CONFIG_SMART_MODULE=y

CONFIG_RTC_DRV_PCF85053=y
CONFIG_SENSORS_MAX31790=y
CONFIG_SENSORS_PIC32=y

# CONFIG_AST2600_ESPI is not set

CONFIG_BLK_DEV_RAM_SIZE=65536

# Input subsystem + pwm-beeper support (exposes /dev/input eventN for beeper-test).
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_MISC=y
CONFIG_INPUT_PWM_BEEPER=y

# PWM controller (pwm@1e610000) that provides the pwm-beeper channel.
# Driver: drivers/hwmon/aspeed-g6-pwm-tach.c (compatible "aspeed,ast2600-pwm-tach").
CONFIG_PWM=y
CONFIG_SENSORS_ASPEED_G6=y
